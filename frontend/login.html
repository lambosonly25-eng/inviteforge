<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — InviteForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23c9a96e'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='%230a0e1a' font-family='serif' font-weight='bold'>IF</text></svg>"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a96e; --gold-light: #e8d5a3;
      --navy: #0a0e1a; --navy-mid: #111827;
      --white: #f8f6f0; --grey: #9ca3af;
      --border: rgba(255,255,255,0.08);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); text-decoration: none; }
    .logo span { color: var(--white); }
    .back-link { font-size: 13px; color: var(--grey); text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--gold); }

    /* ── MAIN ── */
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      width: 100%; max-width: 440px;
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
    }
    .card-icon { font-size: 40px; margin-bottom: 20px; }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 30px; font-weight: 700;
      color: var(--white); margin-bottom: 10px;
    }
    .card-sub { font-size: 15px; color: var(--grey); line-height: 1.6; margin-bottom: 36px; }

    label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--gold); letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 10px;
    }
    input[type="email"] {
      width: 100%; padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px; color: var(--white);
      font-family: 'Inter', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input[type="email"]:focus { border-color: var(--gold); }
    input[type="email"]::placeholder { color: rgba(156,163,175,0.4); }

    button {
      width: 100%; padding: 16px;
      background: var(--gold); color: var(--navy);
      font-size: 15px; font-weight: 700;
      border: none; border-radius: 10px;
      cursor: pointer; font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    button:hover { background: var(--gold-light); transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error {
      display: none; margin-bottom: 16px;
      padding: 12px 16px; border-radius: 8px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171; font-size: 13px;
    }

    /* ── SUCCESS STATE ── */
    .success { display: none; text-align: center; padding: 8px 0; }
    .success-icon { font-size: 52px; margin-bottom: 20px; }
    .success-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px; color: var(--gold); margin-bottom: 12px;
    }
    .success-body { font-size: 15px; color: var(--grey); line-height: 1.7; }
    .success-body strong { color: var(--white); }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0; color: var(--grey); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    .new-event-link {
      display: block; text-align: center;
      padding: 14px; border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--grey); font-size: 14px; font-weight: 500;
      text-decoration: none; transition: all 0.2s;
    }
    .new-event-link:hover { border-color: var(--gold); color: var(--gold); }

    /* ── TABS ── */
    .tabs { display: flex; gap: 0; margin-bottom: 32px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
    .tab {
      flex: 1; padding: 12px; background: none; border: none;
      color: var(--grey); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
    }
    .tab.active { background: rgba(201,169,110,0.1); color: var(--gold); }

    input[type="password"] {
      width: 100%; padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px; color: var(--white);
      font-family: 'Inter', sans-serif; font-size: 15px;
      outline: none; transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input[type="password"]:focus { border-color: var(--gold); }
    input[type="password"]::placeholder { color: rgba(156,163,175,0.4); }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 28px;
      font-size: 12px; color: rgba(255,255,255,0.2);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--gold); text-decoration: none; opacity: 0.7; }
    footer a:hover { opacity: 1; }

    @media (max-width: 480px) {
      header { padding: 16px 20px; }
      .card { padding: 36px 28px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Invite<span>Forge</span></a>
    <a href="/app/" class="back-link">← Create a new invitation</a>
  </header>

  <main>
    <div class="card">

      <!-- SUCCESS STATE -->
      <div class="success" id="successState">
        <div class="success-icon">🎉</div>
        <div class="success-title" id="successTitle">Welcome back!</div>
        <div class="success-body" id="successBody">Redirecting to your dashboard…</div>
      </div>

      <!-- AUTH FORMS -->
      <div id="authForms">
        <div class="card-icon">✉️</div>
        <div class="card-title">Your InviteForge</div>
        <div class="card-sub">Sign in to manage all your events in one place.</div>

        <div class="tabs">
          <button class="tab active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
          <button class="tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
        </div>

        <div class="error" id="errorMsg"></div>

        <!-- SIGN IN -->
        <div id="loginForm">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
          <button id="loginBtn" onclick="doLogin()">Sign In</button>
          <div class="divider">or</div>
          <a href="/app/" class="new-event-link">✨ Create a new event</a>
        </div>

        <!-- REGISTER -->
        <div id="registerForm" style="display:none;">
          <label for="regEmail">Email address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email"/>
          <label for="regPassword">Choose a password</label>
          <input type="password" id="regPassword" placeholder="Minimum 8 characters" autocomplete="new-password"/>
          <label for="regPassword2">Confirm password</label>
          <input type="password" id="regPassword2" placeholder="Repeat password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()"/>
          <button id="registerBtn" onclick="doRegister()">Create Account</button>
          <div class="divider">or</div>
          <a href="/app/" class="new-event-link">✨ Create a new event without an account</a>
        </div>
      </div>

    </div>
  </main>

  <footer>
    © 2026 InviteForge &nbsp;·&nbsp;
    <a href="/privacy">Privacy</a> &nbsp;·&nbsp;
    <a href="/terms">Terms</a> &nbsp;·&nbsp;
    <a href="mailto:support@inviteforge.co.uk">support@inviteforge.co.uk</a>
  </footer>

  <script>
    // If already logged in, go straight to dashboard
    if (localStorage.getItem('if_jwt')) {
      window.location.href = '/app/';
    }

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').style.display    = isLogin ? '' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('errorMsg').style.display = 'none';
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = '⚠️ ' + msg;
      err.style.display = 'block';
    }

    function showSuccess(title, body) {
      document.getElementById('authForms').style.display = 'none';
      document.getElementById('successTitle').textContent = title;
      document.getElementById('successBody').textContent = body;
      document.getElementById('successState').style.display = 'block';
    }

    function storeAndRedirect(token) {
      localStorage.setItem('if_jwt', token);
      showSuccess('Welcome!', 'Redirecting to your dashboard…');
      setTimeout(() => { window.location.href = '/app/'; }, 800);
    }

    async function doLogin() {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');
      document.getElementById('errorMsg').style.display = 'none';
      if (!email || !email.includes('@')) { showError('Enter a valid email.'); return; }
      if (!password) { showError('Enter your password.'); return; }
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          storeAndRedirect(data.token);
        } else {
          showError(data.detail || 'Sign in failed. Please check your details.');
          btn.disabled = false; btn.textContent = 'Sign In';
        }
      } catch(e) {
        showError('Could not reach the server. Check your connection.');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    async function doRegister() {
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regPassword2').value;
      const btn      = document.getElementById('registerBtn');
      document.getElementById('errorMsg').style.display = 'none';
      if (!email || !email.includes('@')) { showError('Enter a valid email.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          storeAndRedirect(data.token);
        } else {
          showError(data.detail || 'Registration failed. Please try again.');
          btn.disabled = false; btn.textContent = 'Create Account';
        }
      } catch(e) {
        showError('Could not reach the server. Check your connection.');
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }

    document.getElementById('loginEmail').focus();
  </script>
</body>
</html>
